<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>floorplan</title>
    <style>
      html, body, #app {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111827;
        color: #e5e7eb;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #app {
        display: flex;
        flex-direction: column;
      }
      #toolbar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        border-bottom: 1px solid #374151;
        background: #1f2937;
      }
      #toolbar button, #toolbar label {
        padding: 6px 12px;
        border: 1px solid #4b5563;
        border-radius: 6px;
        background: #111827;
        color: #e5e7eb;
        cursor: pointer;
        font-size: 14px;
      }
      #toolbar input[type="file"] {
        display: none;
      }
      #status {
        margin-left: auto;
        font-size: 13px;
        color: #9ca3af;
      }
      #status.error {
        color: #f87171;
      }
      #stage {
        flex: 1 1 auto;
        display: flex;
        min-height: 0;
      }
      /* Ruling 13 / D8: the script is the primary surface, the floor a panel beside it. */
      #script {
        flex: 3 1 0;
        min-width: 0;
        overflow-y: auto;
        padding: 12px 16px;
        border-right: 1px solid #374151;
        font-size: 15px;
        line-height: 1.5;
      }
      #script .scene {
        margin: 14px 0 6px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #9ca3af;
      }
      #script .episode {
        margin-top: 12px;
        font-weight: 600;
      }
      #script section[data-check="fail"] {
        border-left: 2px solid #f87171;
        padding-left: 8px;
      }
      #script .line[data-flashback="true"]::before {
        content: 'Flashback — ';
        color: #9ca3af;
        font-size: 12px;
      }
      #script .line {
        margin: 0 0 6px;
      }
      #script .line[data-delivery="real-speech"] {
        color: #fde68a;
      }
      #script .line[data-delivery="dramatised"] {
        color: #a5b4fc;
        font-style: italic;
      }
      /* The citing chain made visible: a line shows the beat ids it stands on. */
      #script .beats {
        display: none;
        margin-left: 8px;
        font-size: 11px;
        color: #6b7280;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #script .line:hover .beats, #script .scene:hover .beats, #script .episode:hover .beats,
      #script :focus .beats {
        display: inline;
      }
      #floor {
        flex: 2 1 0;
        min-width: 240px;
        position: relative;
      }
      #floor canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <button id="replay" type="button">Replay</button>
        <label for="recording">Load .jsonl</label>
        <input id="recording" type="file" accept=".jsonl" />
        <span id="status">connecting…</span>
      </div>
      <div id="stage">
        <div id="script" role="region" aria-label="Episode script"></div>
        <div id="floor"><canvas id="canvas"></canvas></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
